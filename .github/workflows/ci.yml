name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels the running checks of a pull request, but never a run on main:
  # that run may be deploying to production (ADR 0027, amends ADR 0025).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Skip husky's `prepare` hook setup on CI installs (see ADR 0024).
  HUSKY: "0"

jobs:
  # Decides, on a pull request only, whether the diff touches nothing but tool folders, their own
  # e2e spec and docs. Mission: reduce CI minutes (ADR 0053) — a plain `git diff`, no third-party
  # action, so `quality`, `supply-chain`, `lockfile`, `lighthouse` and `preview` are unaffected and
  # only `e2e`'s browser matrix reads the result. A push to main never counts as tool-only.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tool_only: ${{ steps.classify.outputs.tool_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$files"
          # Tool-only: every changed file is under tools/, docs/, or is an e2e spec for a tool
          # that the diff also touches (apps/web/e2e/<tool-id>.spec.ts). Anything else (shared
          # components, security, PWA, runtime, config, CI, dependencies) forces all 3 browsers.
          other=$(echo "$files" | grep -vE '^(tools/|docs/)' | grep -vE '^apps/web/e2e/[^/]+\.spec\.ts$' || true)
          if [ -z "$other" ] && echo "$files" | grep -q '^tools/'; then
            echo "tool_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "tool_only=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: pnpm/action-setup reads the packageManager field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The slow tests (1,000-tool benchmarks, the generated-tree typecheck, spawned CLIs) stay out of
      # `pnpm check` and the pre-push hook, and run here (ADR 0043).
      - run: pnpm test:slow
      # A test website id, so the build carries the analytics scripts that check:budgets measures
      # (ADR 0051). The tracker sends only on the production hostname, so this build sends nothing.
      - run: pnpm build
        env:
          UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000000
      # The JavaScript budget of every tool page, measured on the build output just made (ADR 0037).
      - run: pnpm check:budgets
      # What search engines and share previews will read, on the build just made (ADR 0038 to 0041).
      - run: pnpm check:seo

  # Known vulnerabilities, registry signatures and licences of every installed package, direct or
  # transitive, dev or not (ADR 0049). It gates preview and deploy like quality and e2e do, and
  # .github/workflows/supply-chain.yml runs the same checks on main every week.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails at moderate severity or higher. A registry error fails too: an unanswered audit is not
      # a passed one. docs/runbooks/security.md says what to do when it fires.
      - run: pnpm audit --audit-level moderate
      # Every installed tarball carries a valid npm registry signature.
      - run: pnpm audit signatures
      - run: pnpm check:licenses

  # What a pull request changes in pnpm-lock.yaml, as a comment on the pull request (ADR 0049).
  # It installs nothing and runs no third-party code: the diff script needs only Node, and this is
  # the only job besides preview that may write to the pull request.
  lockfile:
    name: lockfile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Summarize the lockfile change
        id: diff
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "$BASE_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/base-lock.yaml"
          node scripts/lockfile-diff.ts --base "$RUNNER_TEMP/base-lock.yaml" --head pnpm-lock.yaml > "$RUNNER_TEMP/lockfile.md"
          cat "$RUNNER_TEMP/lockfile.md" >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Post or update the lockfile comment
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- lockfile-diff -->"))) | .id' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -F body=@"$RUNNER_TEMP/lockfile.md" > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@"$RUNNER_TEMP/lockfile.md" > /dev/null
          fi

  e2e:
    name: e2e
    needs: [quality, changes]
    # `needs.changes` is skipped on a push to main, which `always()` still lets this job run after;
    # its result is only ever read on a pull request (ADR 0053).
    if: always() && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    # The suite alone took 18 minutes after Mission 17 added the service worker tests (PR #23), so
    # 20 no longer left room for setup and teardown.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A tool-only pull request (ADR 0053) installs and runs Chromium only; every push to main,
      # and any pull request that touches shared code, still exercises all 3 browsers.
      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event_name == 'pull_request' && needs.changes.outputs.tool_only == 'true' }}" = "true" ]; then
            pnpm --filter web exec playwright install --with-deps chromium
          else
            pnpm --filter web exec playwright install --with-deps
          fi
      # The same test website id as quality: the E2E tests check the analytics scripts, and answer
      # Umami's endpoint themselves (e2e/analytics.spec.ts, ADR 0051).
      - name: Run Playwright tests
        env:
          UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000000
        run: |
          if [ "${{ github.event_name == 'pull_request' && needs.changes.outputs.tool_only == 'true' }}" = "true" ]; then
            pnpm test:e2e -- --project chromium
          else
            pnpm test:e2e
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # The site-wide performance budgets (ADR 0052): Lighthouse on its mobile profile, on the home page,
  # /tools/, one category page and every tool page, median of three runs each. The reports are kept
  # as an artifact, pass or fail, so the numbers can be read without running it again.
  lighthouse:
    name: lighthouse
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # The same test website id as quality: pages carry the analytics files, as in production.
      - run: pnpm build
        env:
          UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000000
      - run: pnpm check:lighthouse --out lighthouse-report
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14
          if-no-files-found: ignore

  # Deploys happen only here, in CI, and only after both checks pass (ADR 0027).
  # Gating on `quality`, `e2e`, `supply-chain` and `lighthouse` is our substitute for branch protection on the Free plan.
  # Wrangler is the version pinned in the lockfile and runs through pnpm.
  preview:
    name: preview
    needs: [quality, e2e, supply-chain, lighthouse]
    # Forks and Dependabot do not receive repository secrets, so they get no preview.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job with write access to pull requests (for the preview comment).
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm --filter web exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} ${COMMIT_SHA}" | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -oE "https://pr-${PR_NUMBER}-networksinsights\.[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "No preview URL found in the Wrangler output." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          marker='<!-- preview-deploy -->'
          body=$(printf '%s\n**Preview:** %s\n\nCommit: `%s`\n' "$marker" "$PREVIEW_URL" "$COMMIT_SHA")
          id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-deploy -->"))) | .id' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
      # The preview must send every security header and X-Robots-Tag: noindex (ADR 0048). Six
      # tries, ten seconds apart, while the new version reaches the edge.
      - name: Check the preview's headers
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: pnpm check:production --url "$PREVIEW_URL" --preview --attempts 6

  deploy:
    name: deploy
    needs: [quality, e2e, supply-chain, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # Production deploys are never cancelled midway. A waiting deploy is replaced by a newer one.
    # The rollback workflow uses the same group, so a deploy and a rollback never overlap.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # INDEXNOW_KEY is a repository variable, not a secret: the key is published at /<key>.txt by
      # design. The build writes that file only after launch (ADR 0042).
      # UMAMI_WEBSITE_ID is a repository variable too: the id is in every page. Unset, production
      # has no analytics and its privacy page says so (ADR 0051). Previews never get it.
      - run: pnpm build
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      # The sitemaps that are live now, saved before they are replaced. After the deploy they are
      # compared with the new ones to find the URLs that changed (ADR 0042).
      - name: Save the live sitemaps
        continue-on-error: true
        run: pnpm indexnow snapshot --out "$RUNNER_TEMP/sitemaps-before"
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: pnpm --filter web exec wrangler deploy --message "${COMMIT_SHA}"
      # Tell search engines which URLs changed. It does nothing before launch or without a key, and
      # a failure here never fails a deploy that has already happened.
      - name: Announce changed URLs to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: pnpm indexnow submit --previous "$RUNNER_TEMP/sitemaps-before"

  # Requests the live site after a deploy. It fails until the redirect rule of
  # docs/runbooks/seo-redirects.md exists in the Cloudflare dashboard, and nothing depends on it.
  verify-production:
    name: verify-production
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Six tries, ten seconds apart, while the new version reaches every edge.
      - run: pnpm check:production --attempts 6
