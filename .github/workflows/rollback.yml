name: Rollback production

# Manual only. Rolls the production Worker back to an earlier version (ADR 0027,
# docs/runbooks/deploy-and-rollback.md). It skips quality and e2e on purpose:
# a rollback must not wait for tests.
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Worker version ID to roll back to (see `wrangler versions list` or the Cloudflare dashboard)
        required: true
        type: string

permissions:
  contents: read

env:
  # Skip husky's `prepare` hook setup on CI installs (see ADR 0024).
  HUSKY: "0"

jobs:
  rollback:
    name: rollback
    # A manual run can pick any branch. Only main may touch production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Same group as the production deploy job in ci.yml, never cancelled midway:
    # a rollback and a deploy never run at the same time.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the version ID
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "version_id must be a Worker version ID (a UUID)." >&2
            exit 1
          fi
      - name: Roll back production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
          ACTOR: ${{ github.actor }}
        run: |
          pnpm --filter web exec wrangler rollback "$VERSION_ID" \
            --name networksinsights \
            --message "Rollback by ${ACTOR} in run ${GITHUB_RUN_ID}"
