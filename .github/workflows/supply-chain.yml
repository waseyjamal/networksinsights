name: Supply chain

# The supply-chain checks of ci.yml, run on main every week (ADR 0049). New advisories are
# published about packages that have not changed, so a check that only runs when code changes
# would miss them. A red run here means: read docs/runbooks/security.md.

on:
  schedule:
    # Mondays 05:00 UTC, an hour before Dependabot's weekly run.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm audit signatures
      - run: pnpm check:licenses
