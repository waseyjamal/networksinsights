packages:
  - "apps/*"
  - "packages/*"
  - "tools"
  - "scripts"

savePrefix: "="
engineStrict: true
minimumReleaseAge: 4320
allowBuilds:
  esbuild: false
  workerd: false
overrides:
  # GHSA-3wwx-pv8p-q78v: wrangler > miniflare pins undici 7.29.0; remove once miniflare ships 7.29.1.
  "undici@7.29.0": "7.29.1"
  # GHSA-4q55-j62x-fr9h and 5 more devalue advisories: astro 7.3.2 resolves devalue 5.9.2; remove once astro ships devalue >=5.9.3.
  "devalue@5.9.2": "5.9.4"
auditConfig:
  # GHSA-ch52-4w7c-c8xp: no patched http-cache-semantics; build-time only via astro (ADR 0059). Re-check by 2026-10-17.
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
